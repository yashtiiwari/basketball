<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Double+Ink:wght@100..900&family=Carter+One&family=Dancing+Script:wght@400..700&family=Henny+Penny&family=Luxurious+Roman&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Silkscreen:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href=style.css>

</head>
<body>
<div class="main-parent">
    <div class="main">
        <h1>Basketball Scorecard</h1>
        <div class="container">
            <div class="team-a">
                <h3>Team A</h3>

                <div class="scorecard">
                    <h3 id="score_a">0</h3></div>


                <button class="btn" onclick="addOneA()">+1</button>
                <button class="btn" onclick="addThreeA()">+3</button>
                <button class="btn" onclick="addFiveA()">+5</button>
            </div>
            <div class="team-b">
                <h3>Guest</h3>

                <div class="scorecard">
                    <h3 id="score_b">0</h3>
                </div>


                <button class="btn" onclick="addOneB()">+1</button>
                <button class="btn" onclick="addThreeB()">+3</button>
                <button class="btn" onclick="addFiveB()">+5</button>
            </div>
        </div>

    </div>
</div>
<script src="index.js"></script>

</body>
</html>
